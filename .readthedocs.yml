version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "miniconda-latest"
  apt_packages:
    - mesa-utils
    - libglx-mesa0
    - libgl1
    - xvfb
  jobs:
    pre_build:
      # Generate the Sphinx configuration for this Jupyter Book so it builds.
      - "jupyter-book config sphinx book/"
    build:
      html:
        # Same as RTD's default Sphinx command, but under xvfb-run so the executed notebooks have
        # an X display. PyVista/VTK need one to render; without it the newer VTK either kills the
        # kernel or blocks (pyvista.start_xvfb(), which notebooks used to call, was removed in
        # pyvista 0.48). Matches the Codespaces setup, which runs Xvfb on :99.
        # TEMPORARY DIAGNOSTICS (remove once the PR build passes): PR builds keep running ~16 min
        # after Sphinx exits until RTD's time limit kills them, with no output. Bound Sphinx with a
        # timeout, then report its exit code, any processes it left behind, and the output size.
        - cd book && (timeout --kill-after=30 1200 xvfb-run -a -s "-screen 0 1920x1080x24" python -m sphinx -T -W --keep-going -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html; rc=$?; echo "=== sphinx exit $rc at $(date -u +%T)"; echo "=== processes after sphinx:"; ps -eo pid,ppid,etime,stat,args | cut -c1-200; echo "=== output size:"; du -sh $READTHEDOCS_OUTPUT/html; exit $rc)

conda:
  environment: environment.yml

sphinx:
  builder: html
  fail_on_warning: true
  configuration: book/conf.py