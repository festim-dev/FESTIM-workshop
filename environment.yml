name: festim-workshop
channels:
  - conda-forge
  - defaults

dependencies:
  - setuptools
  - wheel<0.45
  - jupyter-book<2.0
  - python<3.13  # autoemulate is not compatible with Python 3.13 yet
  - pip=23.3
  - jupytext # necessary to open MyST files using BinderHub https://jupyterbook.org/en/stable/interactive/launchbuttons.html#launchbuttons-binder
  - sphinx-tags
  - ipywidgets
  - matplotlib
  - meshio[all]
  - ipykernel
  - nbconvert
  - sphinx-codeautolink
  - fenics-dolfinx>=0.11.0  # >=0.11 required for FESTIM 2.2 gas enclosures (real elements)
  # festim 2.2-rc.1 is not on conda-forge yet: installed via pip below.
  # scifem and io4dolfinx are its conda-forge deps (prebuilt against dolfinx).
  - scifem>=0.20.0
  - io4dolfinx
  - pyvista<0.47.1
  - python-gmsh
  - shapely
  - scipy
  - pyparsing
  - imageio
  - trame
  - vtk
  - trame-vtk<2.10.3
  - trame-vuetify
  - nest-asyncio2
  - pip:
    - festim==2.2rc1  # gas enclosures, F.plot, discontiguous meshes (needs dolfinx>=0.11)
    - h-transport-materials==0.16
    - foam2dolfinx>=1.1
    - openmc2dolfinx>=1.0.2
    - torch<2.12.0
    - autoemulate